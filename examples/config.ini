# Copy to ~/.config/swanctl-tray/config.ini
[tunnel]
# Name of the connection in /etc/swanctl/swanctl.conf (the block under `connections {`)
connection = UPVNET
# Name of the child SA inside that connection (the block under `children {`)
child = net
# Text shown in the menu and notifications
label = VPN UPV
# Seconds to wait for the second factor (push approval) before giving up
timeout = 120
